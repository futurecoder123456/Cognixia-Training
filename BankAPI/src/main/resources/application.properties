spring.application.name=BankAPI
spring.data.mongodb.uri=mongodb://localhost:27017/bankdb
app.security.admin-username=${ADMIN_USERNAME:admin}
app.security.admin-password=${ADMIN_PASSWORD:change-me}
app.security.jwt-secret=${JWT_SECRET:change-this-secret-to-a-long-random-value-1234567890}
app.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:3600000}